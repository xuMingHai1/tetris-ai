name: Tetris CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
          cache: maven

      - name: Verify
        run: mvn -B -ntp verify
