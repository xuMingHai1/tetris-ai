name: PR AI Benchmark

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select-benchmark:
    name: Select Benchmark
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.base.ref == github.event.repository.default_branch
      }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      benchmark: ${{ steps.select.outputs.benchmark }}
      reason: ${{ steps.select.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select deterministic benchmark
        id: select
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          recovery_candidate_scan_changed=false
          recovery_intervention_changed=false
          recovery_reserve_persistence_validation_changed=false
          recovery_reserve_runtime_validation_changed=false
          recovery_reserve_validation_changed=false
          recovery_reserve_changed=false
          recovery_changed=false
          shape_guard_changed=false
          shape_changed=false
          objective_changed=false
          action_changed=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/ai-benchmark.yml|.github/workflows/ai-benchmark-pr.yml)
                # Exercise the most feature-rich deterministic path when benchmark
                # infrastructure itself changes.
                shape_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/RecoveryCandidateScanBenchmark.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryCandidateScanApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/RecoveryCandidateScanBenchmarkTest.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryCandidateScanApplicationTest.java)
                recovery_candidate_scan_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryInterventionPlanningAgent.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryInterventionComparisonApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryInterventionPlanningAgentTest.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryInterventionComparisonApplicationTest.java)
                recovery_intervention_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReservePersistenceValidationApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReservePersistenceValidationApplicationTest.java)
                recovery_reserve_persistence_validation_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveRuntimeValidationApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveRuntimeValidationApplicationTest.java)
                recovery_reserve_runtime_validation_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveValidationApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveValidationApplicationTest.java)
                recovery_reserve_validation_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveLeadTimeApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryReserveLeadTimeApplicationTest.java)
                recovery_reserve_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/RecoveryRobustnessBenchmark.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryRobustnessApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/RecoveryRobustnessBenchmarkTest.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/RecoveryRobustnessApplicationTest.java)
                recovery_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/ConstructionSafetyGuard.java|              src/main/java/xyz/xuminghai/tetris/ai/BuildShapeConstructionGuard*.java|              src/test/java/xyz/xuminghai/tetris/ai/ConstructionSafetyGuardTest.java|              src/test/java/xyz/xuminghai/tetris/ai/BuildShapeConstructionGuard*.java)
                shape_guard_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/BuildShape*.java|              src/main/java/xyz/xuminghai/tetris/ai/Shape*.java|              src/main/java/xyz/xuminghai/tetris/ai/ConstructionSafetyEnvelopeBenchmark.java|              src/main/java/xyz/xuminghai/tetris/ai/BoardOccupancyMetrics.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/ShapeFeasibilityApplication.java|              src/test/java/xyz/xuminghai/tetris/ai/BuildShape*.java|              src/test/java/xyz/xuminghai/tetris/ai/Shape*.java|              src/test/java/xyz/xuminghai/tetris/ai/ConstructionSafetyEnvelopeBenchmarkTest.java|              src/test/java/xyz/xuminghai/tetris/ai/benchmark/ShapeFeasibilityApplicationTest.java)
                shape_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/ObjectiveRisk*.java|              src/main/java/xyz/xuminghai/tetris/ai/ObjectiveSafetyBudget.java|              src/main/java/xyz/xuminghai/tetris/ai/TuckHunter*.java|              src/main/java/xyz/xuminghai/tetris/ai/AiObjective.java|              src/test/java/xyz/xuminghai/tetris/ai/ObjectiveRisk*.java|              src/test/java/xyz/xuminghai/tetris/ai/ObjectiveSafetyBudgetTest.java|              src/test/java/xyz/xuminghai/tetris/ai/TuckHunter*.java)
                objective_changed=true
                ;;

              src/main/java/xyz/xuminghai/tetris/ai/Action*.java|              src/main/java/xyz/xuminghai/tetris/ai/AiAction.java|              src/main/java/xyz/xuminghai/tetris/ai/AiPlan*.java|              src/main/java/xyz/xuminghai/tetris/ai/AiPlanningAgent*.java|              src/main/java/xyz/xuminghai/tetris/ai/DeterministicActionPlanningAgent.java|              src/main/java/xyz/xuminghai/tetris/ai/BoardSimulator.java|              src/main/java/xyz/xuminghai/tetris/ai/PlacementCandidate.java|              src/main/java/xyz/xuminghai/tetris/ai/GameSnapshot.java|              src/main/java/xyz/xuminghai/tetris/ai/HeuristicTetrisAgent.java|              src/main/java/xyz/xuminghai/tetris/ai/NextPiece*.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/BenchmarkApplication.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/BoardHealthSummary.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/GameBenchmarkResult.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/HeadlessGameRunner.java|              src/main/java/xyz/xuminghai/tetris/ai/benchmark/ReachabilityBenchmarkApplication.java|              src/main/java/xyz/xuminghai/tetris/core/BoardRules.java|              src/main/java/xyz/xuminghai/tetris/core/Tetris*.java|              src/test/java/xyz/xuminghai/tetris/ai/Action*.java|              src/test/java/xyz/xuminghai/tetris/ai/AiPlan*.java|              src/test/java/xyz/xuminghai/tetris/ai/BoardSimulatorTest.java|              src/test/java/xyz/xuminghai/tetris/core/BoardRulesTest.java)
                action_changed=true
                ;;
            esac
          done <<< "$changed_files"

          benchmark=none
          reason="no AI benchmark-sensitive files changed"

          # One benchmark per PR revision keeps the self-hosted runner bounded.
          # Prefer the most specialized path when categories overlap.
          if [ "$recovery_candidate_scan_changed" = "true" ]; then
            benchmark=recovery-candidate-scan
            reason="warned-state recovery candidate scan changed"
          elif [ "$recovery_intervention_changed" = "true" ]; then
            benchmark=recovery-intervention-comparison
            reason="paired recovery intervention experiment changed"
          elif [ "$recovery_reserve_persistence_validation_changed" = "true" ]; then
            benchmark=recovery-reserve-persistence-validation
            reason="recovery warning persistence validation changed"
          elif [ "$recovery_reserve_runtime_validation_changed" = "true" ]; then
            benchmark=recovery-reserve-runtime-validation
            reason="production BUILD_SHAPE recovery failure validation changed"
          elif [ "$recovery_reserve_validation_changed" = "true" ]; then
            benchmark=recovery-reserve-validation
            reason="out-of-sample recovery reserve validation changed"
          elif [ "$recovery_reserve_changed" = "true" ]; then
            benchmark=recovery-reserve-lead-time
            reason="recovery reserve lead-time calibration changed"
          elif [ "$recovery_changed" = "true" ]; then
            benchmark=recovery-robustness
            reason="recovery robustness calibration changed"
          elif [ "$shape_guard_changed" = "true" ]; then
            benchmark=compare-shape-guard
            reason="BUILD_SHAPE construction guard experiment changed"
          elif [ "$shape_changed" = "true" ]; then
            benchmark=shape-feasibility
            reason="BUILD_SHAPE / shape benchmark semantics changed"
          elif [ "$objective_changed" = "true" ]; then
            benchmark=compare-adaptive
            reason="objective risk or safety policy changed"
          elif [ "$action_changed" = "true" ]; then
            benchmark=action-provenance
            reason="action-native reachability or shared board facts changed"
          fi

          echo "benchmark=$benchmark" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Selected benchmark: $benchmark ($reason)"

  recovery-candidate-scan:
    name: Recovery Candidate Scan
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-candidate-scan' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-candidate-scan
      games: '20'
      max_pieces: '1000'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '6000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-intervention-comparison:
    name: Recovery Intervention Comparison
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-intervention-comparison' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-intervention-comparison
      games: '30'
      max_pieces: '1000'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '5000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-reserve-persistence-validation:
    name: Recovery Warning Persistence Validation
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-reserve-persistence-validation' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-reserve-persistence-validation
      games: '30'
      max_pieces: '1000'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '4000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-reserve-runtime-validation:
    name: Production Recovery Failure Validation
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-reserve-runtime-validation' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-reserve-runtime-validation
      games: '40'
      max_pieces: '1000'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '3000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-reserve-validation:
    name: Recovery Reserve Validation
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-reserve-validation' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-reserve-validation
      games: '20'
      max_pieces: '1000'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '2000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-reserve-lead-time:
    name: Recovery Reserve Lead-Time
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-reserve-lead-time' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-reserve-lead-time
      games: '10'
      max_pieces: '250'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  recovery-robustness:
    name: Recovery Robustness
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'recovery-robustness' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: recovery-robustness
      games: '10'
      max_pieces: '250'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  shape-guard-comparison:
    name: Shape Guard Comparison
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'compare-shape-guard' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: compare-shape-guard
      games: '10'
      max_pieces: '250'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  shape-feasibility:
    name: Shape Feasibility
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'shape-feasibility' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: shape-feasibility
      games: '20'
      max_pieces: '500'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      viability_search_depth: '4'
      viability_beam_width: '32'
      viability_greedy_depth: '24'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  adaptive-objective:
    name: Adaptive Objective
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'compare-adaptive' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: compare-adaptive
      games: '10'
      max_pieces: '250'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  action-provenance:
    name: Action Provenance
    needs: select-benchmark
    if: ${{ needs.select-benchmark.outputs.benchmark == 'action-provenance' }}
    uses: ./.github/workflows/ai-benchmark.yml
    with:
      agent: action-provenance
      games: '10'
      max_pieces: '250'
      feasibility_depth: '24'
      feasibility_beam_width: '128'
      seed: '1000'
      risk_profile: conservative
      confirm_jev_cost: false

  benchmark-gate:
    name: PR AI Benchmark Gate
    if: >-
      ${{
        always()
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.base.ref == github.event.repository.default_branch
      }}
    needs:
      - select-benchmark
      - recovery-candidate-scan
      - recovery-intervention-comparison
      - recovery-reserve-persistence-validation
      - recovery-reserve-runtime-validation
      - recovery-reserve-validation
      - recovery-reserve-lead-time
      - recovery-robustness
      - shape-guard-comparison
      - shape-feasibility
      - adaptive-objective
      - action-provenance
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    steps:
      - name: Require selected benchmark
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select-benchmark.result }}
          SELECTED: ${{ needs.select-benchmark.outputs.benchmark }}
          REASON: ${{ needs.select-benchmark.outputs.reason }}
          CANDIDATE_SCAN_RESULT: ${{ needs.recovery-candidate-scan.result }}
          INTERVENTION_RESULT: ${{ needs.recovery-intervention-comparison.result }}
          PERSISTENCE_VALIDATION_RESULT: ${{ needs.recovery-reserve-persistence-validation.result }}
          RUNTIME_VALIDATION_RESULT: ${{ needs.recovery-reserve-runtime-validation.result }}
          VALIDATION_RESULT: ${{ needs.recovery-reserve-validation.result }}
          RESERVE_RESULT: ${{ needs.recovery-reserve-lead-time.result }}
          RECOVERY_RESULT: ${{ needs.recovery-robustness.result }}
          GUARD_RESULT: ${{ needs.shape-guard-comparison.result }}
          SHAPE_RESULT: ${{ needs.shape-feasibility.result }}
          OBJECTIVE_RESULT: ${{ needs.adaptive-objective.result }}
          ACTION_RESULT: ${{ needs.action-provenance.result }}
        run: |
          set -euo pipefail

          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::Benchmark selection failed with result: $SELECT_RESULT"
            exit 1
          fi

          case "$SELECTED" in
            none)
              echo "No deterministic AI benchmark required: $REASON"
              ;;
            recovery-candidate-scan)
              [ "$CANDIDATE_SCAN_RESULT" = "success" ] || {
                echo "::error::recovery-candidate-scan benchmark result: $CANDIDATE_SCAN_RESULT"
                exit 1
              }
              ;;
            recovery-intervention-comparison)
              [ "$INTERVENTION_RESULT" = "success" ] || {
                echo "::error::recovery-intervention-comparison benchmark result: $INTERVENTION_RESULT"
                exit 1
              }
              ;;
            recovery-reserve-persistence-validation)
              [ "$PERSISTENCE_VALIDATION_RESULT" = "success" ] || {
                echo "::error::recovery-reserve-persistence-validation benchmark result: $PERSISTENCE_VALIDATION_RESULT"
                exit 1
              }
              ;;
            recovery-reserve-runtime-validation)
              [ "$RUNTIME_VALIDATION_RESULT" = "success" ] || {
                echo "::error::recovery-reserve-runtime-validation benchmark result: $RUNTIME_VALIDATION_RESULT"
                exit 1
              }
              ;;
            recovery-reserve-validation)
              [ "$VALIDATION_RESULT" = "success" ] || {
                echo "::error::recovery-reserve-validation benchmark result: $VALIDATION_RESULT"
                exit 1
              }
              ;;
            recovery-reserve-lead-time)
              [ "$RESERVE_RESULT" = "success" ] || {
                echo "::error::recovery-reserve-lead-time benchmark result: $RESERVE_RESULT"
                exit 1
              }
              ;;
            recovery-robustness)
              [ "$RECOVERY_RESULT" = "success" ] || {
                echo "::error::recovery-robustness benchmark result: $RECOVERY_RESULT"
                exit 1
              }
              ;;
            compare-shape-guard)
              [ "$GUARD_RESULT" = "success" ] || {
                echo "::error::compare-shape-guard benchmark result: $GUARD_RESULT"
                exit 1
              }
              ;;
            shape-feasibility)
              [ "$SHAPE_RESULT" = "success" ] || {
                echo "::error::shape-feasibility benchmark result: $SHAPE_RESULT"
                exit 1
              }
              ;;
            compare-adaptive)
              [ "$OBJECTIVE_RESULT" = "success" ] || {
                echo "::error::compare-adaptive benchmark result: $OBJECTIVE_RESULT"
                exit 1
              }
              ;;
            action-provenance)
              [ "$ACTION_RESULT" = "success" ] || {
                echo "::error::action-provenance benchmark result: $ACTION_RESULT"
                exit 1
              }
              ;;
            *)
              echo "::error::Unknown selected benchmark: $SELECTED"
              exit 1
              ;;
          esac

          echo "PR AI benchmark gate passed: $SELECTED ($REASON)"
