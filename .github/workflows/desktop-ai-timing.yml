name: Desktop AI Timing

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: JavaFX capture duration (1–900 seconds)
        required: true
        default: 120
        type: number
      seed:
        description: Signed 64-bit 7-bag seed (same sequence, timing still varies)
        required: true
        default: '1000'
        type: string
  pull_request:
    paths:
      - .github/workflows/desktop-ai-timing.yml
      - pom.xml
      - src/main/java/xyz/xuminghai/tetris/DesktopAiTimingApplication.java
      - src/main/java/xyz/xuminghai/tetris/TetrisApplication.java
      - src/main/java/xyz/xuminghai/tetris/GameInputBindings.java
      - src/main/java/xyz/xuminghai/tetris/UiInteractionApplication.java
      - src/main/java/xyz/xuminghai/tetris/ai/*.java
      - src/main/java/xyz/xuminghai/tetris/core/**
      - src/main/java/xyz/xuminghai/tetris/game/**
      - src/main/java/xyz/xuminghai/tetris/view/**
      - src/main/resources/css/**
      - scripts/analyze_ai_decision_trace.py

permissions:
  contents: read

concurrency:
  group: desktop-ai-timing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.base.ref == github.event.repository.default_branch) }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Load capture-only Chinese font
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            --output "$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"

      - name: Verify desktop keyboard and layout interactions
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dglass.platform=headless -Dprism.order=sw
        run: |
          set -euo pipefail
          timeout 120 ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.UiInteractionApplication \
            compile javafx:run > "$RUNNER_TEMP/ui-interaction.log" 2>&1
          cat "$RUNNER_TEMP/ui-interaction.log"

      - name: Capture JavaFX timing
        shell: bash
        env:
          TRACE_SECONDS: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds }}
          TETRIS_AI_TRACE_SECONDS: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds }}
          TETRIS_AI_TRACE_SEED: ${{ github.event_name == 'pull_request' && '1000' || inputs.seed }}
          TETRIS_AI_AGENT: action
          TETRIS_AI_OBJECTIVE: build-shape
          TETRIS_AI_PREVIEW_RESCUE: 'true'
          TETRIS_AI_DECISION_TRACE: 'true'
          TETRIS_UI_SCREENSHOT_DIR: ${{ runner.temp }}
          TETRIS_UI_CAPTURE_FONT: ${{ runner.temp }}/NotoSansCJKsc-Regular.otf
          JAVA_TOOL_OPTIONS: -Dglass.platform=headless -Dprism.order=sw
        run: |
          set -euo pipefail
          if [[ ! "$TRACE_SECONDS" =~ ^[0-9]+$ ]] || (( TRACE_SECONDS < 1 || TRACE_SECONDS > 900 )); then
            echo 'seconds must be between 1 and 900' >&2
            exit 1
          fi
          timeout "$((TRACE_SECONDS + 300))" ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.DesktopAiTimingApplication \
            compile javafx:run > "$RUNNER_TEMP/ai-decision.log" 2>&1
          python3 scripts/analyze_ai_decision_trace.py "$RUNNER_TEMP/ai-decision.log" \
            | tee "$RUNNER_TEMP/ai-decision-summary.txt"

      - name: Capture compact UI with reduced motion
        shell: bash
        env:
          TETRIS_AI_TRACE_SECONDS: '8'
          TETRIS_AI_TRACE_SEED: '1000'
          TETRIS_AI_AGENT: action
          TETRIS_AI_OBJECTIVE: build-shape
          TETRIS_AI_PREVIEW_RESCUE: 'true'
          TETRIS_UI_CAPTURE_WIDTH: '750'
          TETRIS_UI_CAPTURE_HEIGHT: '700'
          TETRIS_UI_CAPTURE_REDUCED_MOTION: 'true'
          TETRIS_UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-compact
          TETRIS_UI_CAPTURE_FONT: ${{ runner.temp }}/NotoSansCJKsc-Regular.otf
          JAVA_TOOL_OPTIONS: -Dglass.platform=headless -Dprism.order=sw
        run: |
          set -euo pipefail
          timeout 120 ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.DesktopAiTimingApplication \
            javafx:run > "$RUNNER_TEMP/ui-compact.log" 2>&1

      - name: Publish timing summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Desktop AI Timing'
            echo
            echo '~~~text'
            cat "$RUNNER_TEMP/ai-decision-summary.txt"
            echo '~~~'
            echo
            echo 'Headless Linux runner observation; see the artifact for the raw trace.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture reference-size UI
        shell: bash
        env:
          TETRIS_AI_TRACE_SECONDS: '8'
          TETRIS_AI_TRACE_SEED: '1000'
          TETRIS_AI_AGENT: action
          TETRIS_AI_OBJECTIVE: build-shape
          TETRIS_AI_PREVIEW_RESCUE: 'true'
          TETRIS_UI_CAPTURE_WIDTH: '1024'
          TETRIS_UI_CAPTURE_HEIGHT: '950'
          TETRIS_UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-reference
          TETRIS_UI_CAPTURE_FONT: ${{ runner.temp }}/NotoSansCJKsc-Regular.otf
          JAVA_TOOL_OPTIONS: -Dglass.platform=headless -Dprism.order=sw
        run: |
          set -euo pipefail
          timeout 120 ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.DesktopAiTimingApplication \
            javafx:run > "$RUNNER_TEMP/ui-reference.log" 2>&1

      - name: Upload desktop timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ai-timing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ai-decision.log
            ${{ runner.temp }}/ui-interaction.log
            ${{ runner.temp }}/ai-decision-summary.txt
            ${{ runner.temp }}/ui-v1-ready.png
            ${{ runner.temp }}/ui-v1-playing.png
            ${{ runner.temp }}/ui-v1-row-shift.png
            ${{ runner.temp }}/ui-v1-paused.png
            ${{ runner.temp }}/ui-v1-manual.png
            ${{ runner.temp }}/ui-v1-bottom.png
            ${{ runner.temp }}/ui-v1-move.png
            ${{ runner.temp }}/ui-v1-landing.png
            ${{ runner.temp }}/ui-compact.log
            ${{ runner.temp }}/ui-compact/*.png
            ${{ runner.temp }}/ui-reference.log
            ${{ runner.temp }}/ui-reference/*.png
          if-no-files-found: ignore
          retention-days: 7
