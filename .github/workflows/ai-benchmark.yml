name: AI Benchmark

on:
  workflow_call:
    inputs:
      agent:
        description: Agent to benchmark
        required: true
        type: string
      games:
        description: Number of deterministic games
        required: false
        default: '20'
        type: string
      max_pieces:
        description: Maximum pieces per game
        required: false
        default: '500'
        type: string
      feasibility_depth:
        description: Piece-sequence depth for shape-feasibility search
        required: false
        default: '24'
        type: string
      feasibility_beam_width:
        description: Unique board states retained per depth for shape-feasibility search
        required: false
        default: '128'
        type: string
      viability_search_depth:
        description: Future-piece depth for construction viability search
        required: false
        default: '4'
        type: string
      viability_beam_width:
        description: Unique boards retained per construction viability depth
        required: false
        default: '32'
        type: string
      viability_greedy_depth:
        description: Future-piece horizon for survival top-1 viability rollout
        required: false
        default: '24'
        type: string
      seed:
        description: Seed for the first game; later games increment by one
        required: false
        default: '1000'
        type: string
      risk_profile:
        description: Fixed objective risk profile for tuck-hunter or compare-objective
        required: false
        default: conservative
        type: string
      confirm_jev_cost:
        description: Confirm external TypeSafe API usage
        required: false
        default: false
        type: boolean
    secrets:
      TYPESAFE_API_KEY:
        required: false

  workflow_dispatch:
    inputs:
      agent:
        description: Agent to benchmark
        required: true
        default: heuristic
        type: choice
        options:
          - heuristic
          - lookahead
          - jev
          - action
          - tuck-hunter
          - adaptive-tuck-hunter
          - build-shape
          - build-shape-preview
          - shape-feasibility
          - action-provenance
          - jev-action
          - compare
          - compare-action
          - compare-objective
          - compare-adaptive
          - compare-shape
          - compare-shape-preview
          - calibrate-objective
          - reachability
      games:
        description: Number of deterministic games
        required: true
        default: '20'
        type: string
      max_pieces:
        description: Maximum pieces per game
        required: true
        default: '500'
        type: string
      feasibility_depth:
        description: Piece-sequence depth for shape-feasibility search
        required: true
        default: '24'
        type: string
      feasibility_beam_width:
        description: Unique board states retained per depth for shape-feasibility search
        required: true
        default: '128'
        type: string
      viability_search_depth:
        description: Future-piece depth for construction viability search
        required: true
        default: '4'
        type: string
      viability_beam_width:
        description: Unique boards retained per construction viability depth
        required: true
        default: '32'
        type: string
      viability_greedy_depth:
        description: Future-piece horizon for survival top-1 viability rollout
        required: true
        default: '24'
        type: string
      seed:
        description: Seed for the first game; later games increment by one
        required: true
        default: '1000'
        type: string
      risk_profile:
        description: Fixed objective risk profile for tuck-hunter or compare-objective
        required: true
        default: conservative
        type: choice
        options:
          - strict
          - conservative
          - balanced
          - risky
      confirm_jev_cost:
        description: Confirm external TypeSafe API usage for jev, jev-action, compare or compare-action
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Headless AI Benchmark
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
          cache: maven

      - name: Validate benchmark inputs
        shell: bash
        env:
          GAMES: ${{ inputs.games }}
          MAX_PIECES: ${{ inputs.max_pieces }}
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail

          if [[ ! "$GAMES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::games must be a positive integer"
            exit 1
          fi
          if [[ ! "$MAX_PIECES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_pieces must be a positive integer"
            exit 1
          fi
          if [[ ! "$SEED" =~ ^-?[0-9]+$ ]]; then
            echo "::error::seed must be an integer"
            exit 1
          fi

      - name: Validate shape feasibility inputs
        if: ${{ inputs.agent == 'shape-feasibility' }}
        shell: bash
        env:
          FEASIBILITY_DEPTH: ${{ inputs.feasibility_depth }}
          FEASIBILITY_BEAM_WIDTH: ${{ inputs.feasibility_beam_width }}
          VIABILITY_SEARCH_DEPTH: ${{ inputs.viability_search_depth }}
          VIABILITY_BEAM_WIDTH: ${{ inputs.viability_beam_width }}
          VIABILITY_GREEDY_DEPTH: ${{ inputs.viability_greedy_depth }}
        run: |
          set -euo pipefail

          if [[ ! "$FEASIBILITY_DEPTH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::feasibility_depth must be a positive integer"
            exit 1
          fi
          if [[ ! "$FEASIBILITY_BEAM_WIDTH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::feasibility_beam_width must be a positive integer"
            exit 1
          fi

      - name: Validate construction viability inputs
        if: ${{ inputs.agent == 'shape-feasibility' }}
        shell: bash
        env:
          VIABILITY_SEARCH_DEPTH: ${{ inputs.viability_search_depth }}
          VIABILITY_BEAM_WIDTH: ${{ inputs.viability_beam_width }}
          VIABILITY_GREEDY_DEPTH: ${{ inputs.viability_greedy_depth }}
        run: |
          set -euo pipefail

          for value in "$VIABILITY_SEARCH_DEPTH" "$VIABILITY_BEAM_WIDTH" "$VIABILITY_GREEDY_DEPTH"; do
            if [[ ! "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::construction viability inputs must be positive integers"
              exit 1
            fi
          done

      - name: Validate Jev configuration
        if: ${{ inputs.agent == 'jev' || inputs.agent == 'jev-action' || inputs.agent == 'compare' || inputs.agent == 'compare-action' }}
        shell: bash
        env:
          GAMES: ${{ inputs.games }}
          MAX_PIECES: ${{ inputs.max_pieces }}
          CONFIRM_JEV_COST: ${{ inputs.confirm_jev_cost }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail

          if [ "$CONFIRM_JEV_COST" != "true" ]; then
            echo "::error::Set confirm_jev_cost=true before running a Jev benchmark"
            exit 1
          fi
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::error::Repository secret TYPESAFE_API_KEY is required for Jev benchmarks"
            exit 1
          fi

          total_decisions=$((GAMES * MAX_PIECES))
          if [ "$total_decisions" -gt 200 ]; then
            echo "::error::Jev benchmark is capped at 200 potential decisions per manual run; reduce games or max_pieces"
            exit 1
          fi

      - name: Run heuristic benchmark
        if: ${{ inputs.agent == 'heuristic' || inputs.agent == 'compare' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: heuristic
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee "$RUNNER_TEMP/benchmark-output.log"

      - name: Run local lookahead benchmark
        if: ${{ inputs.agent == 'lookahead' || inputs.agent == 'compare' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: lookahead
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "$RUNNER_TEMP/benchmark-output.log"

      - name: Run Jev benchmark
        if: ${{ inputs.agent == 'jev' || inputs.agent == 'compare' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: jev
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "$RUNNER_TEMP/benchmark-output.log"

      - name: Run deterministic action benchmark
        if: ${{ inputs.agent == 'action' || inputs.agent == 'compare-action' || inputs.agent == 'compare-objective' || inputs.agent == 'compare-adaptive' || inputs.agent == 'compare-shape' || inputs.agent == 'calibrate-objective' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: action
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run tuck-hunter objective benchmark
        if: ${{ inputs.agent == 'tuck-hunter' || inputs.agent == 'compare-objective' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: tuck-hunter
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
          TETRIS_BENCHMARK_RISK_PROFILE: ${{ inputs.risk_profile }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run adaptive tuck-hunter benchmark
        if: ${{ inputs.agent == 'adaptive-tuck-hunter' || inputs.agent == 'compare-adaptive' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: adaptive-tuck-hunter
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run BUILD_SHAPE benchmark
        if: ${{ inputs.agent == 'build-shape' || inputs.agent == 'compare-shape' || inputs.agent == 'compare-shape-preview' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: build-shape
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run BUILD_SHAPE preview-lookahead benchmark
        if: ${{ inputs.agent == 'build-shape-preview' || inputs.agent == 'compare-shape-preview' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: build-shape-preview
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run shape construction feasibility benchmark
        if: ${{ inputs.agent == 'shape-feasibility' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.feasibility_depth }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
          TETRIS_BENCHMARK_FEASIBILITY_BEAM_WIDTH: ${{ inputs.feasibility_beam_width }}
          TETRIS_BENCHMARK_VIABILITY_SEARCH_DEPTH: ${{ inputs.viability_search_depth }}
          TETRIS_BENCHMARK_VIABILITY_BEAM_WIDTH: ${{ inputs.viability_beam_width }}
          TETRIS_BENCHMARK_VIABILITY_GREEDY_DEPTH: ${{ inputs.viability_greedy_depth }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.ShapeFeasibilityApplication \
            javafx:run | tee "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run objective risk calibration
        if: ${{ inputs.agent == 'calibrate-objective' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          for profile in strict conservative balanced risky; do
            echo "# calibration profile=${profile}"
            TETRIS_BENCHMARK_AGENT=tuck-hunter \
            TETRIS_BENCHMARK_RISK_PROFILE="${profile}" \
            ./mvnw --batch-mode --no-transfer-progress \
              -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
              javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"
          done

      - name: Run local action provenance benchmark
        if: ${{ inputs.agent == 'action-provenance' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: action-provenance
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run Jev action benchmark
        if: ${{ inputs.agent == 'jev-action' || inputs.agent == 'compare-action' }}
        shell: bash
        env:
          TETRIS_BENCHMARK_AGENT: jev-action
          TETRIS_BENCHMARK_GAMES: ${{ inputs.games }}
          TETRIS_BENCHMARK_MAX_PIECES: ${{ inputs.max_pieces }}
          TETRIS_BENCHMARK_SEED: ${{ inputs.seed }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.BenchmarkApplication \
            javafx:run | tee -a "${RUNNER_TEMP}/benchmark-output.log"

      - name: Run action reachability benchmark
        if: ${{ inputs.agent == 'reachability' }}
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -Dmain.class=xyz.xuminghai.tetris/xyz.xuminghai.tetris.ai.benchmark.ReachabilityBenchmarkApplication \
            javafx:run | tee "$RUNNER_TEMP/benchmark-output.log"

      - name: Collect benchmark results
        shell: bash
        env:
          AGENT: ${{ inputs.agent }}
          RISK_PROFILE: ${{ inputs.risk_profile }}
          GAMES: ${{ inputs.games }}
          MAX_PIECES: ${{ inputs.max_pieces }}
          SEED: ${{ inputs.seed }}
          FEASIBILITY_DEPTH: ${{ inputs.feasibility_depth }}
          FEASIBILITY_BEAM_WIDTH: ${{ inputs.feasibility_beam_width }}
        run: |
          set -euo pipefail

          mkdir -p target/benchmark
          cp "$RUNNER_TEMP/benchmark-output.log" target/benchmark/raw.log
          awk '
            /^agent,/ {
              if (!header_seen) {
                print
                header_seen = 1
              }
              next
            }
            /^(heuristic|lookahead|jev|action|tuck-hunter-[a-z]+|build-shape-[a-z-]+|action-provenance|jev-action|reachability),/ {
              print
            }
          ' target/benchmark/raw.log > target/benchmark/results.csv
          grep '^# ' target/benchmark/raw.log > target/benchmark/summary.txt || true
          grep '^jev_decision,' target/benchmark/raw.log > target/benchmark/jev-decisions.csv || true
          grep '^action_provenance,' target/benchmark/raw.log > target/benchmark/action-provenance.csv || true
          grep '^tuck_hunter_decision,' target/benchmark/raw.log > target/benchmark/tuck-hunter-decisions.csv || true
          grep '^build_shape_decision,' target/benchmark/raw.log > target/benchmark/build-shape-decisions.csv || true
          grep '^build_shape_game,' target/benchmark/raw.log > target/benchmark/build-shape-games.csv || true
          grep '^shape_feasibility,' target/benchmark/raw.log > target/benchmark/shape-feasibility.csv || true
          grep '^shape_feasibility_witness,' target/benchmark/raw.log > target/benchmark/shape-feasibility-witness.csv || true
          grep '^shape_witness_audit,' target/benchmark/raw.log > target/benchmark/shape-witness-audit.csv || true
          grep '^construction_safety_envelope,' target/benchmark/raw.log > target/benchmark/construction-safety-envelope.csv || true
          grep '^construction_viability,' target/benchmark/raw.log > target/benchmark/construction-viability.csv || true

          {
            echo "commit=${GITHUB_SHA}"
            echo "agent=${AGENT}"
            echo "risk_profile=${RISK_PROFILE}"
            echo "games=${GAMES}"
            echo "max_pieces=${MAX_PIECES}"
            echo "feasibility_depth=${FEASIBILITY_DEPTH}"
            echo "feasibility_beam_width=${FEASIBILITY_BEAM_WIDTH}"
            echo "viability_search_depth=${VIABILITY_SEARCH_DEPTH}"
            echo "viability_beam_width=${VIABILITY_BEAM_WIDTH}"
            echo "viability_greedy_depth=${VIABILITY_GREEDY_DEPTH}"
            echo "seed=${SEED}"
          } > target/benchmark/metadata.txt

      - name: Publish benchmark summary
        shell: bash
        run: |
          {
            echo "## AI Benchmark"
            echo
            echo '~~~text'
            cat target/benchmark/summary.txt
            echo '~~~'
            echo
            echo "Artifact contains per-game CSV, Jev/action-provenance/tuck-hunter/BUILD_SHAPE telemetry, shape-feasibility evidence/witness data when applicable, summary, metadata, and the raw Maven/application log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-benchmark-${{ inputs.agent }}-${{ github.run_id }}
          path: |
            target/benchmark/results.csv
            target/benchmark/jev-decisions.csv
            target/benchmark/action-provenance.csv
            target/benchmark/tuck-hunter-decisions.csv
            target/benchmark/build-shape-decisions.csv
            target/benchmark/build-shape-games.csv
            target/benchmark/shape-feasibility.csv
            target/benchmark/shape-feasibility-witness.csv
            target/benchmark/shape-witness-audit.csv
            target/benchmark/construction-safety-envelope.csv
            target/benchmark/construction-viability.csv
            target/benchmark/summary.txt
            target/benchmark/metadata.txt
            target/benchmark/raw.log
          if-no-files-found: warn
          retention-days: 30
